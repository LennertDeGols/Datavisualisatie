<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waar zit mijn tijd?</title>
  <link rel="stylesheet" href="datavisualisatie.css">
</head>
<body>

  <header>
    <nav>
      <h1>Portfolio</h1>
    </nav>
  </header>

  <main>
    <section class="intro">
      <p class="label">Persoonlijke datavisualisatie</p>
      <h2>Waar zit mijn tijd?</h2>
      <p>
        Deze pagina wordt een interactieve datavisualisatie over mijn zitgedrag.
        De data komt uit mijn Visual Design werkstuk.
      </p>
    </section>
    <section class="filters">
    <button class="filter active" data-day="Alles">Alles</button>
    <button class="filter" data-day="Vrijdag">Vrijdag</button>
    <button class="filter" data-day="Zaterdag">Zaterdag</button>
    <button class="filter" data-day="Zondag">Zondag</button>
    </section>
    <section id="visualisation" class="visualisation"></section>
  </main>
  <script src="datavisualisatie.js"></script>
</body>
</html>
